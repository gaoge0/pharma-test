name: 采集医药情报数据

# 在 GitHub 服务器（美国）上抓取 Google News，解决中国大陆无法直连的问题。
# 每次把去重后的累积数据集提交回仓库的 data/ 目录，随时可下载用于 AI 分析。

on:
  push:
    branches: [main]
  schedule:
    # 每天 UTC 2:23 / 8:23 / 14:23 / 20:23 各跑一次（北京时间 10:23 / 16:23 / 22:23 / 次日 4:23）
    - cron: "23 2,8,14,20 * * *"
  workflow_dispatch: # 也支持手动触发

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 获取网站源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 使用 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 抓取并合并情报数据
        run: node scripts/export-news.mjs

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/news-master.json data/news-master.csv
          if git diff --cached --quiet; then
            echo "本次没有新数据变更，无需提交"
          else
            git commit -m "chore: 更新情报数据集 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
